  <script>function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️'; // Emoticono de corazón
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = Math.random() * window.innerHeight + 'px'; // Cambia la posición vertical
    heart.style.animationDuration = Math.random() * 2 + 1 + 's';
    document.getElementById('heart-container').appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 3000); // Remove the heart after 3 seconds
}

setInterval(createHeart, 500); // Create a heart every 0.5 seconds</script>
